<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Twist Pop Snake Base</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;overflow:hidden;background:#edf0ef;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#182028}header{position:fixed;z-index:5;top:0;left:0;right:0;height:84px;background:#fffffff2;padding:14px 18px}h1{margin:0;font-size:21px}.sub{font-size:12px;color:#687680;margin-top:4px}#c{position:absolute;inset:84px 0 0;width:100%;height:calc(100% - 84px);touch-action:none}.note{position:fixed;z-index:6;top:99px;left:16px;right:16px;background:#fff;border-radius:16px;padding:10px;text-align:center;font-size:13px}.bar{position:fixed;z-index:6;bottom:20px;left:14px;right:14px;display:flex;gap:8px}.bar button{flex:1;border:0;border-radius:15px;padding:12px 4px;background:#fff;font-weight:800;box-shadow:0 4px 15px #0002}.bar .on{background:#182028;color:#fff}</style></head><body><header><h1>TWIST POP · 魔尺底座</h1><div class="sub">直接迁移现成 Magic Snake 的单节几何与关节变换</div></header><div class="note" id="note">直线：24 节标准魔尺。点“拧第 8 节”看后半条绕真实斜轴旋转。</div><canvas id="c"></canvas><div class="bar"><button id="s" class="on">直线</button><button id="t">拧第 8 节</button><button id="u">再拧 90°</button></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.181.0/build/three.module.js';
const cv=document.querySelector('#c'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.outputColorSpace=THREE.SRGBColorSpace;
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(35,1,.1,100);cam.position.set(7,5.5,11);cam.lookAt(0,0,0);sc.add(new THREE.HemisphereLight(0xffffff,0x7a838a,2.5));let dl=new THREE.DirectionalLight(0xffffff,3);dl.position.set(5,8,6);dl.castShadow=true;sc.add(dl);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshStandardMaterial({color:0xe4e3df,roughness:.92}));floor.rotation.x=-Math.PI/2;floor.position.y=-2.4;floor.receiveShadow=true;sc.add(floor);
const SIZE=1,rootTwo=Math.sqrt(2),localJointCenter=new THREE.Vector3(3*rootTwo/4,rootTwo/4,0);
function prism(upper){const width=Math.sqrt(2)*SIZE,bevel=.024,sh=new THREE.Shape();if(upper){sh.moveTo(0,width/2);sh.lineTo(width/2,0);sh.lineTo(width,width/2)}else{sh.moveTo(0,0);sh.lineTo(width,0);sh.lineTo(width/2,width/2)}sh.closePath();const depth=SIZE-bevel*2,g=new THREE.ExtrudeGeometry(sh,{depth,steps:1,bevelEnabled:true,bevelSegments:4,bevelSize:bevel,bevelThickness:bevel,bevelOffset:-bevel,curveSegments:1});const cx=width/2,cy=upper?width/3:width/6;g.translate(-cx,-cy,-depth/2);g.scale(.992,.992,.992);g.translate(cx,cy,0);g.computeVertexNormals();return g}
const geos=[prism(false),prism(true)],mats=[new THREE.MeshStandardMaterial({color:0x286fbd,roughness:.28}),new THREE.MeshStandardMaterial({color:0xfffdf8,roughness:.35})],root=new THREE.Group();sc.add(root),meshes=[];
for(let i=0;i<24;i++){let m=new THREE.Mesh(geos[i%2],mats[i%2]);m.castShadow=true;m.receiveShadow=true;root.add(m);meshes.push(m)}
function transforms(turns){let matrices=Array.from({length:24},(_,p)=>new THREE.Matrix4().makeTranslation((rootTwo/2)*p,0,0));for(let joint=0;joint<23;joint++){let q=turns[joint]||0;if(!q)continue;let prev=matrices[joint],pivot=localJointCenter.clone().applyMatrix4(prev),axis=(joint%2===0?new THREE.Vector3(rootTwo/2,rootTwo/2,0):new THREE.Vector3(rootTwo/2,-rootTwo/2,0)).transformDirection(prev).normalize(),rot=new THREE.Matrix4().makeRotationAxis(axis,-q*Math.PI/2),around=new THREE.Matrix4().makeTranslation(pivot.x,pivot.y,pivot.z).multiply(rot).multiply(new THREE.Matrix4().makeTranslation(-pivot.x,-pivot.y,-pivot.z));for(let p=joint+1;p<24;p++)matrices[p].premultiply(around)}let center=new THREE.Vector3(rootTwo*23/4,0,0);return matrices.map(M=>{let pos=new THREE.Vector3(),quat=new THREE.Quaternion(),scale=new THREE.Vector3();M.decompose(pos,quat,scale);return{pos:pos.sub(center),quat}})}
let current=Array(23).fill(0);function apply(){transforms(current).forEach((x,i)=>{meshes[i].position.copy(x.pos);meshes[i].quaternion.copy(x.quat)})}apply();root.rotation.set(-.18,.18,0);
function state(n){current.fill(0);if(n>=1)current[7]=1;if(n>=2)current[7]=2;apply();document.querySelector('#note').textContent=n===0?'直线：24 节标准魔尺。':'第 8 个关节已旋转 '+(n*90)+'°，后面 16 节作为整体跟随。';['s','t','u'].forEach((id,i)=>document.querySelector('#'+id).classList.toggle('on',i===n))}
document.querySelector('#s').onclick=()=>state(0);document.querySelector('#t').onclick=()=>state(1);document.querySelector('#u').onclick=()=>state(2);
function resize(){let w=innerWidth,h=innerHeight-84;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}resize();addEventListener('resize',resize);let drag=false,x=0,y=0;cv.onpointerdown=e=>{drag=true;x=e.clientX;y=e.clientY};cv.onpointermove=e=>{if(!drag)return;root.rotation.y+=(e.clientX-x)*.009;root.rotation.x+=(e.clientY-y)*.006;x=e.clientX;y=e.clientY};cv.onpointerup=()=>drag=false;(function loop(){requestAnimationFrame(loop);R.render(sc,cam)})();
</script></body></html>
