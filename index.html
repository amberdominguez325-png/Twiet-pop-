<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Twist Pop Snake Base</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;overflow:hidden;background:#edf0ef;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#182028}header{position:fixed;z-index:5;top:0;left:0;right:0;height:82px;background:#fffffff0;padding:13px 17px}h1{margin:0;font-size:21px}.sub{font-size:12px;color:#6c7881;margin-top:4px}#c{position:absolute;inset:82px 0 0;width:100%;height:calc(100% - 82px);touch-action:none}.note{position:fixed;z-index:6;top:96px;left:15px;right:15px;background:#fff;border-radius:16px;padding:10px;text-align:center;font-size:13px}.bar{position:fixed;z-index:6;bottom:19px;left:12px;right:12px;display:flex;gap:7px}.bar button{flex:1;border:0;border-radius:15px;padding:12px 4px;background:#fff;font-weight:800;font-size:13px;box-shadow:0 4px 15px #0002}.bar .on{background:#182028;color:#fff}</style></head><body><header><h1>TWIST POP · 魔尺底座</h1><div class="sub">这版直接迁移现成 Magic Snake 的 prism + joint transform</div></header><div class="note" id="note">直线状态：24 节应当像你实物照片一样组成连续长条</div><canvas id="c"></canvas><div class="bar"><button id="s" class="on">直线</button><button id="t">拧第 8 节</button><button id="t2">再拧一次</button><button id="reset">复位</button></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.181.0/build/three.module.js';
const cv=document.querySelector('#c'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.outputColorSpace=THREE.SRGBColorSpace;
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(34,1,.1,120);cam.position.set(8,6,12);cam.lookAt(0,0,0);sc.add(new THREE.HemisphereLight(0xffffff,0x7c858b,2.5));let dl=new THREE.DirectionalLight(0xffffff,3);dl.position.set(5,9,7);dl.castShadow=true;sc.add(dl);
let floor=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshStandardMaterial({color:0xe5e4e0,roughness:.92}));floor.rotation.x=-Math.PI/2;floor.position.y=-2.1;floor.receiveShadow=true;sc.add(floor);
const SIZE=1,rootTwo=Math.sqrt(2),jointCenter=new THREE.Vector3(3*rootTwo/4,rootTwo/4,0),scale=new THREE.Vector3(1,1,1);
function prism(upper){const width=rootTwo,bevel=.024,shape=new THREE.Shape();if(upper){shape.moveTo(0,width/2);shape.lineTo(width/2,0);shape.lineTo(width,width/2)}else{shape.moveTo(0,0);shape.lineTo(width,0);shape.lineTo(width/2,width/2)}shape.closePath();const depth=SIZE-bevel*2,g=new THREE.ExtrudeGeometry(shape,{depth,steps:1,bevelEnabled:true,bevelSegments:4,bevelSize:bevel,bevelThickness:bevel,bevelOffset:-bevel,curveSegments:1}),shell=.992,cx=width/2,cy=upper?width/3:width/6;g.translate(-cx,-cy,-depth/2);g.scale(shell,shell,shell);g.translate(cx,cy,0);g.computeVertexNormals();return g}
const geo=[prism(false),prism(true)],mats=[new THREE.MeshStandardMaterial({color:0x173aab,roughness:.3}),new THREE.MeshStandardMaterial({color:0xf7f4eb,roughness:.42})],root=new THREE.Group();sc.add(root),meshes=[];
for(let i=0;i<24;i++){let m=new THREE.Mesh(geo[i%2],mats[i%2]);m.castShadow=true;m.receiveShadow=true;root.add(m);meshes.push(m)}
function transforms(turns){let ms=Array.from({length:24},(_,p)=>new THREE.Matrix4().makeTranslation((rootTwo/2)*p,0,0));for(let j=0;j<23;j++){let q=turns[j]||0;if(!q)continue;let prev=ms[j],pivot=jointCenter.clone().applyMatrix4(prev),axis=(j%2===0?new THREE.Vector3(rootTwo/2,rootTwo/2,0):new THREE.Vector3(rootTwo/2,-rootTwo/2,0)).transformDirection(prev).normalize(),rot=new THREE.Matrix4().makeRotationAxis(axis,-q*Math.PI/2),around=new THREE.Matrix4().makeTranslation(...pivot).multiply(rot).multiply(new THREE.Matrix4().makeTranslation(-pivot.x,-pivot.y,-pivot.z));for(let p=j+1;p<24;p++)ms[p].premultiply(around)}let center=new THREE.Vector3(rootTwo*23/4,0,0);return ms.map(M=>{let p=new THREE.Vector3(),q=new THREE.Quaternion();M.decompose(p,q,scale.clone());return{p:p.sub(center),q}})}
let turns=Array(23).fill(0);function apply(){transforms(turns).forEach((x,i)=>{meshes[i].position.copy(x.p);meshes[i].quaternion.copy(x.q)})}apply();root.rotation.set(-.18,.18,0);
function set(q,id,msg){turns.fill(0);turns[7]=q;apply();document.querySelector('#note').textContent=msg;document.querySelectorAll('.bar button').forEach(b=>b.classList.remove('on'));document.querySelector('#'+id).classList.add('on')}
document.querySelector('#s').onclick=()=>set(0,'s','直线状态：24 节应当像你实物照片一样组成连续长条');document.querySelector('#t').onclick=()=>set(1,'t','第 8 个关节 +90°：第 9～24 节整体跟着转');document.querySelector('#t2').onclick=()=>set(2,'t2','第 8 个关节 180°');document.querySelector('#reset').onclick=()=>set(0,'s','已复位');
function resize(){let w=innerWidth,h=innerHeight-82;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}resize();addEventListener('resize',resize);let drag=false,x=0,y=0;cv.onpointerdown=e=>{drag=true;x=e.clientX;y=e.clientY;cv.setPointerCapture(e.pointerId)};cv.onpointermove=e=>{if(!drag)return;root.rotation.y+=(e.clientX-x)*.008;root.rotation.x+=(e.clientY-y)*.006;x=e.clientX;y=e.clientY};cv.onpointerup=()=>drag=false;(function loop(){requestAnimationFrame(loop);R.render(sc,cam)})();
</script></body></html>
