<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Twist Pop</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#eef2f5;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#17212b;overflow:hidden}header{height:90px;padding:18px;background:white;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:27px}.sub{color:#71808c;font-size:13px}.stat{background:#f1f4f6;padding:10px 12px;border-radius:17px;font-weight:800}.g{height:calc(100vh - 90px);position:relative}svg{width:100%;height:100%;touch-action:none}.tip{position:absolute;z-index:2;top:15px;left:50%;transform:translateX(-50%);background:white;padding:10px 14px;border-radius:20px;white-space:nowrap}.seg{stroke:white;stroke-width:2;filter:drop-shadow(0 4px 4px #0002)}.j{fill:white;stroke:#34424d;stroke-width:2}.hit{fill:transparent}.ctl{position:absolute;bottom:22px;left:0;right:0;text-align:center}button{border:0;background:white;padding:12px 18px;margin:5px;border-radius:15px;font-weight:800;font-size:15px;box-shadow:0 4px 16px #0002}#pop{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%) scale(.8);font-size:42px;font-weight:1000;opacity:0;transition:.15s}#pop.on{opacity:1;transform:translate(-50%,-50%) scale(1.15)}</style></head><body><header><div><h1>TWIST POP</h1><div class="sub">折叠 · 接触 · 消除 · 变短</div></div><div class="stat">剩余 <span id="left">12</span> · <span id="moves">0</span>步</div></header><div class="g"><div class="tip">点白色关节，后半条旋转 90°</div><svg id="b" viewBox="0 0 390 680"></svg><div id="pop">POP!</div><div class="ctl"><button id="undo">↶ 撤销</button><button id="reset">重开</button></div></div><script>
(()=>{const S=document.querySelector('#b'),L=document.querySelector('#left'),M=document.querySelector('#moves'),P=document.querySelector('#pop'),C=['#286ff0','#ffd13f','#ef5966','#4cc47a'];const st=[[0,0],[1,0],[2,0],[3,0],[3,1],[2,1],[1,1],[0,1],[0,2],[1,2],[2,2],[3,2]],co=[0,1,0,2,3,1,2,0,3,2,1,0];let ch,mv,his,busy;
function E(n,a){let e=document.createElementNS('http://www.w3.org/2000/svg',n);Object.keys(a).forEach(k=>e.setAttribute(k,a[k]));return e}
function init(){ch=co.map((c,i)=>({c,x:st[i][0],y:st[i][1]}));mv=0;his=[];busy=false;draw()}
function draw(){S.innerHTML='';let xs=ch.map(p=>p.x),ys=ch.map(p=>p.y),cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2,sp=Math.max(Math.max(...xs)-Math.min(...xs)+1,Math.max(...ys)-Math.min(...ys)+1,4),s=Math.min(78,300/sp),q=ch.map(p=>({x:195+(p.x-cx)*s,y:335+(p.y-cy)*s}));for(let i=0;i<q.length-1;i++)S.append(E('line',{x1:q[i].x,y1:q[i].y,x2:q[i+1].x,y2:q[i+1].y,stroke:'#bdc7ce','stroke-width':22,'stroke-linecap':'round'}));ch.forEach((p,i)=>{let a=q[i],r=s*.34,f=i%2?1:-1;S.append(E('polygon',{points:(a.x-r)+','+(a.y-r*f)+' '+(a.x+r)+','+a.y+' '+(a.x-r)+','+(a.y+r*f),fill:C[p.c],class:'seg'}))});for(let i=0;i<q.length-1;i++){let x=(q[i].x+q[i+1].x)/2,y=(q[i].y+q[i+1].y)/2,h=E('circle',{cx:x,cy:y,r:25,class:'hit'});h.onclick=()=>turn(i);S.append(h);S.append(E('circle',{cx:x,cy:y,r:7,class:'j'}))}L.textContent=ch.length;M.textContent=mv}
function norm(){let x=Math.min(...ch.map(p=>p.x)),y=Math.min(...ch.map(p=>p.y));ch.forEach(p=>{p.x-=x;p.y-=y})}
function turn(k){if(busy)return;his.push(JSON.stringify(ch));mv++;let o=ch[k];for(let i=k+1;i<ch.length;i++){let x=ch[i].x-o.x,y=ch[i].y-o.y;ch[i].x=o.x-y;ch[i].y=o.y+x}norm();draw();setTimeout(check,100)}
function check(){let z=new Set;for(let c=0;c<4;c++){let ids=[];ch.forEach((p,i)=>p.c===c&&ids.push(i));for(let a=0;a<ids.length;a++)for(let b=a+1;b<ids.length;b++)for(let d=b+1;d<ids.length;d++){let t=[ids[a],ids[b],ids[d]],e=0;for(let u=0;u<3;u++)for(let v=u+1;v<3;v++){let A=ch[t[u]],B=ch[t[v]];if(Math.abs(A.x-B.x)+Math.abs(A.y-B.y)===1)e++}if(e>=2)t.forEach(i=>z.add(i))}}if(z.size>=3){busy=true;P.classList.add('on');setTimeout(()=>{P.classList.remove('on');ch=ch.filter((_,i)=>!z.has(i));relink();norm();busy=false;draw();if(ch.length<=1){P.textContent='CLEAR!';P.classList.add('on')}else setTimeout(check,150)},280)}}
function relink(){let d=[[1,0],[0,1],[-1,0],[0,-1]],dir=0,x=0,y=0;ch.forEach((p,i)=>{if(i){if(i%3===0)dir=(dir+1)%4;x+=d[dir][0];y+=d[dir][1]}p.x=x;p.y=y})}
document.querySelector('#reset').onclick=init;document.querySelector('#undo').onclick=()=>{if(his.length&&!busy){ch=JSON.parse(his.pop());mv=Math.max(0,mv-1);draw()}};init()})();
</script></body></html>
