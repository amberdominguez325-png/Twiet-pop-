<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Rubik Snake Kinematic Test</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#eef0ef;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#182028}header{position:fixed;z-index:5;top:0;left:0;right:0;height:82px;background:#fffffff0;padding:14px 18px}h1{margin:0;font-size:22px}.sub{font-size:12px;color:#687680;margin-top:4px}#c{position:absolute;inset:82px 0 0;width:100%;height:calc(100% - 82px);touch-action:none}.bar{position:fixed;z-index:6;bottom:22px;left:14px;right:14px;display:flex;gap:8px}.bar button{flex:1;border:0;background:white;border-radius:15px;padding:12px 6px;font-weight:800;box-shadow:0 4px 16px #0002}.bar button.on{background:#182028;color:white}.tip{position:fixed;z-index:6;top:98px;left:18px;right:18px;text-align:center;background:#fff;border-radius:16px;padding:10px;font-size:13px}</style></head><body><header><h1>真实链结构测试</h1><div class="sub">24 个楔形棱柱 · 父子关节递推 · 不再从矩形反推</div></header><div class="tip">先看“直线”：每一节都是独立实体；再切换“折叠测试”看关节后整条是否一起运动</div><canvas id="c"></canvas><div class="bar"><button id="straight" class="on">直线</button><button id="fold">折叠测试</button><button id="packed">收拢预设</button></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const cv=document.querySelector('#c'),ren=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.shadowMap.enabled=true;ren.outputColorSpace=THREE.SRGBColorSpace;
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(35,1,.1,120);cam.position.set(9,7,13);cam.lookAt(0,0,0);sc.add(new THREE.HemisphereLight(0xffffff,0x7b8389,2.4));let dl=new THREE.DirectionalLight(0xffffff,3);dl.position.set(5,9,7);dl.castShadow=true;sc.add(dl);
let floor=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshStandardMaterial({color:0xe5e4e0,roughness:.9}));floor.rotation.x=-Math.PI/2;floor.position.y=-2.4;floor.receiveShadow=true;sc.add(floor);
const blue=new THREE.MeshPhysicalMaterial({color:0x16349f,roughness:.3,clearcoat:.25}),ivory=new THREE.MeshPhysicalMaterial({color:0xf4f1e7,roughness:.4,clearcoat:.12});
/* A module is a triangular prism whose two rectangular side faces and diagonal face are all real geometry.
   Local chain enters at hinge A and exits at hinge B. Each next pivot is parented to the previous exit,
   so rotating any pivot automatically carries every downstream module. */
function prism(){
 const L=1.12,H=1.12,D=1.12;
 const v=[0,-H/2,-D/2, 0,H/2,-D/2, L,-H/2,-D/2, 0,-H/2,D/2, 0,H/2,D/2, L,-H/2,D/2];
 const id=[0,2,1,3,4,5,0,3,5,0,5,2,0,1,4,0,4,3,1,2,5,1,5,4];
 let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));g.setIndex(id);g.computeVertexNormals();return g;
}
const G=prism(),world=new THREE.Group();sc.add(world);let pivots=[],meshes=[];let parent=world;
for(let i=0;i<24;i++){
 let pivot=new THREE.Group();parent.add(pivot);pivots.push(pivot);
 let m=new THREE.Mesh(G,i%2?ivory:blue);m.castShadow=true;m.receiveShadow=true;
 // alternate the prism orientation around the chain axis; this is the physical alternating wedge rhythm
 if(i%2)m.rotation.x=Math.PI;
 pivot.add(m);meshes.push(m);
 let next=new THREE.Group();next.position.x=1.12;pivot.add(next);parent=next;
}
function zero(){pivots.forEach(p=>p.rotation.set(0,0,0));world.rotation.set(-.12,-.28,.03);world.position.set(-12.8,0,0)}
function preset(type){zero();if(type==='fold'){pivots[7].rotation.x=Math.PI/2;pivots[12].rotation.x=-Math.PI/2;pivots[16].rotation.x=Math.PI/2;world.position.set(-5.8,0,0)}
 if(type==='packed'){// joint-angle preset; geometry remains the same 24-node chain
  const seq=[0,1,1,3,1,1,3,1,1,3,1,1,3,1,1,3,1,1,3,1,1,3,1,0];
  pivots.forEach((p,i)=>p.rotation.x=seq[i]*Math.PI/2);world.position.set(-1.8,1.1,0);world.rotation.set(-.2,-.55,.05)}
}
preset('straight');
document.querySelector('#straight').onclick=()=>{preset('straight');sel('straight')};document.querySelector('#fold').onclick=()=>{preset('fold');sel('fold')};document.querySelector('#packed').onclick=()=>{preset('packed');sel('packed')};function sel(id){document.querySelectorAll('.bar button').forEach(b=>b.classList.remove('on'));document.querySelector('#'+id).classList.add('on')}
function resize(){let w=innerWidth,h=innerHeight-82;ren.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}resize();addEventListener('resize',resize);let drag=false,lx=0,ly=0;cv.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointermove',e=>{if(!drag)return;world.rotation.y+=(e.clientX-lx)*.008;world.rotation.z+=(e.clientY-ly)*.005;lx=e.clientX;ly=e.clientY});cv.addEventListener('pointerup',()=>drag=false);(function loop(){requestAnimationFrame(loop);ren.render(sc,cam)})();
</script></body></html>
