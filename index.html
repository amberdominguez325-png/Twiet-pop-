<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Twist Pop Tutorial</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#edf2f4;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#18222b;overflow:hidden}header{height:84px;background:#fff;padding:15px 18px;display:flex;align-items:center;justify-content:space-between}h1{font-size:25px;margin:0}.sub{font-size:12px;color:#75828b;margin-top:3px}.badge{font-weight:800;background:#f0f3f5;padding:9px 12px;border-radius:16px}.game{height:calc(100vh - 84px);position:relative}.coach{position:absolute;z-index:5;top:15px;left:18px;right:18px;background:#fff;border-radius:18px;padding:13px 15px;box-shadow:0 5px 18px #0001;text-align:center;font-weight:750}.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}.snake{position:relative;width:350px;height:380px}.piece{position:absolute;width:86px;height:86px;transition:.45s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 7px 6px #0002)}.piece .top{position:absolute;inset:0;clip-path:polygon(0 0,100% 50%,0 100%);border-radius:7px;background:var(--c);border:2px solid #fff}.piece .shine{position:absolute;inset:8px 17px 8px 8px;clip-path:polygon(0 0,100% 50%,0 100%);background:linear-gradient(135deg,#ffffff88,#ffffff08);pointer-events:none}.joint{position:absolute;width:38px;height:38px;border-radius:50%;background:#fff;border:4px solid #26333d;box-shadow:0 4px 10px #0003;z-index:4;transition:.2s}.joint.target{animation:pulse .85s infinite}.joint.target:after{content:"点这里";position:absolute;top:42px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#17212b;color:#fff;padding:7px 10px;border-radius:12px;font-size:12px}.hand{position:absolute;font-size:42px;z-index:8;animation:hand 1.2s infinite;pointer-events:none}.arrow{position:absolute;font-size:42px;font-weight:900;z-index:7;animation:arrow 1.2s infinite;pointer-events:none}.pop{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%) scale(.7);font-size:45px;font-weight:1000;opacity:0;z-index:10}.pop.on{animation:pop .65s}.bottom{position:absolute;bottom:24px;left:18px;right:18px;display:flex;gap:10px}.btn{flex:1;border:0;border-radius:17px;padding:13px;background:#fff;font-weight:800;font-size:15px;box-shadow:0 4px 15px #0001}.next{background:#17212b;color:#fff;display:none}@keyframes pulse{50%{transform:scale(1.3);box-shadow:0 0 0 13px #ffd43b55}}@keyframes hand{0%,100%{transform:translate(0,0)}50%{transform:translate(32px,28px)}}@keyframes arrow{0%,100%{transform:translateX(0);opacity:.5}50%{transform:translateX(28px);opacity:1}}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}35%{opacity:1;transform:translate(-50%,-50%) scale(1.35)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}.ghost{opacity:.12;transform:scale(.5)!important}</style></head><body><header><div><h1>TWIST POP</h1><div class="sub">先只学一件事：把魔尺掰过去</div></div><div class="badge">第 1 关</div></header><div class="game"><div class="coach" id="coach">① 找到发光的关节　② 点一下，把右边整段掰过去</div><div class="stage"><div class="snake" id="snake"></div></div><div class="pop" id="pop">POP!</div><div class="bottom"><button class="btn" id="reset">重来</button><button class="btn next" id="next">再玩一次</button></div></div><script>
const snake=document.querySelector('#snake'),coach=document.querySelector('#coach'),pop=document.querySelector('#pop'),next=document.querySelector('#next');let done=false;
const data=[['#2f75e8',35,155,0],['#ffd23f',105,155,180],['#2f75e8',175,155,0],['#ef5d68',245,155,180],['#2f75e8',245,225,90],['#52c77a',175,225,270]];
function build(){snake.innerHTML='';done=false;next.style.display='none';coach.textContent='① 找到发光的关节　② 点一下，把右边整段掰过去';data.forEach((d,i)=>{let p=document.createElement('div');p.className='piece';p.id='p'+i;p.style='--c:'+d[0]+';left:'+d[1]+'px;top:'+d[2]+'px;transform:rotate('+d[3]+'deg)';p.innerHTML='<div class="top"></div><div class="shine"></div>';snake.append(p)});let j=document.createElement('button');j.className='joint target';j.style='left:208px;top:179px';j.onclick=play;j.setAttribute('aria-label','折叠这个关节');snake.append(j);let h=document.createElement('div');h.className='hand';h.style='left:190px;top:120px';h.textContent='☝️';snake.append(h);let a=document.createElement('div');a.className='arrow';a.style='left:235px;top:120px';a.textContent='↘';snake.append(a)}
function play(){if(done)return;done=true;snake.querySelector('.joint').classList.remove('target');snake.querySelector('.hand').remove();snake.querySelector('.arrow').remove();coach.textContent='对！你掰的是关节，右边整段会一起转。';let p3=document.querySelector('#p3'),p4=document.querySelector('#p4'),p5=document.querySelector('#p5');p3.style.left='175px';p3.style.top='85px';p3.style.transform='rotate(90deg)';p4.style.left='105px';p4.style.top='85px';p4.style.transform='rotate(180deg)';p5.style.left='35px';p5.style.top='85px';p5.style.transform='rotate(0deg)';setTimeout(()=>{coach.textContent='三个蓝色被这一折带到一起 → 消除！';pop.classList.add('on');['p0','p2','p4'].forEach(id=>document.querySelector('#'+id).classList.add('ghost'));setTimeout(()=>{coach.textContent='POP！消掉以后，整条魔尺变短。核心玩法就是这个。';document.querySelector('#p1').style.left='95px';document.querySelector('#p1').style.top='170px';p3.style.left='165px';p3.style.top='170px';p5.style.left='235px';p5.style.top='170px';next.style.display='block'},650)},700)}
document.querySelector('#reset').onclick=build;next.onclick=build;build();
</script></body></html>
