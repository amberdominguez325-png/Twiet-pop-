<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Magic Snake Model</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#f1f3f2;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#182028}header{position:fixed;z-index:4;top:0;left:0;right:0;height:82px;background:#ffffffef;padding:15px 18px}h1{font-size:23px;margin:0}.sub{font-size:13px;color:#71808a;margin-top:4px}#c{position:absolute;inset:82px 0 0;width:100%;height:calc(100% - 82px);touch-action:none}.tip{position:fixed;z-index:5;bottom:26px;left:50%;transform:translateX(-50%);background:#182028;color:white;padding:10px 15px;border-radius:18px;white-space:nowrap;font-size:13px}</style></head><body><header><h1>TWIST POP · 魔尺模型测试</h1><div class="sub">先不做游戏，只确认：这东西第一眼是不是魔尺</div></header><canvas id="c"></canvas><div class="tip">单指拖动旋转视角 · 双指缩放</div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const cv=document.querySelector('#c'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(34,1,.1,100);cam.position.set(7,6.5,10);cam.lookAt(0,0,0);
scene.add(new THREE.HemisphereLight(0xffffff,0x879098,2.4));let d=new THREE.DirectionalLight(0xffffff,3.2);d.position.set(4,8,6);d.castShadow=true;scene.add(d);
let floor=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshStandardMaterial({color:0xe8e9e7,roughness:.9}));floor.rotation.x=-Math.PI/2;floor.position.y=-1.65;floor.receiveShadow=true;scene.add(floor);
const snake=new THREE.Group();scene.add(snake);
// A wedge is a triangular prism: triangular end profile extruded along Z.
// Rotate 90° around Y so the prism's long axis runs along X, producing the chunky magic-snake module.
function wedgeGeometry(){
 const sh=new THREE.Shape(); sh.moveTo(-.72,-.72); sh.lineTo(.72,-.72); sh.lineTo(-.72,.72); sh.closePath();
 const g=new THREE.ExtrudeGeometry(sh,{depth:1.42,bevelEnabled:true,bevelSegments:2,bevelSize:.025,bevelThickness:.025});
 g.translate(0,0,-.71); g.rotateY(Math.PI/2); g.computeVertexNormals(); return g;
}
const wg=wedgeGeometry(), blue=new THREE.MeshPhysicalMaterial({color:0x173eaa,roughness:.3,clearcoat:.22}), white=new THREE.MeshPhysicalMaterial({color:0xf5f2e8,roughness:.42,clearcoat:.12});
const n=12, step=1.38;
for(let i=0;i<n;i++){
 let m=new THREE.Mesh(wg,i%2?white:blue);m.castShadow=true;m.receiveShadow=true;
 m.position.x=(i-(n-1)/2)*step;
 // alternating wedges mate into a continuous rectangular snake, like a physical Rubik's Snake
 m.rotation.x=(i%2)*Math.PI;
 snake.add(m);
 // thin seam line emphasizes hidden hinge rather than giant visible joint
 if(i<n-1){let seam=new THREE.Mesh(new THREE.BoxGeometry(.025,1.48,1.48),new THREE.MeshStandardMaterial({color:0x5b6470,roughness:.8}));seam.position.x=(i-(n-1)/2)*step+step/2;snake.add(seam)}
}
snake.rotation.y=-.20;snake.rotation.z=.04;
// floor shadow contact
function resize(){let w=innerWidth,h=innerHeight-82;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}resize();addEventListener('resize',resize);
let drag=false,lx=0,ly=0,dist=0;
cv.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!drag)return;snake.rotation.y+=(e.clientX-lx)*.009;snake.rotation.x+=(e.clientY-ly)*.006;lx=e.clientX;ly=e.clientY});
cv.addEventListener('pointerup',()=>drag=false);
cv.addEventListener('wheel',e=>{cam.position.multiplyScalar(e.deltaY>0?1.08:.92);cam.lookAt(0,0,0)},{passive:true});
function animate(){requestAnimationFrame(animate);R.render(scene,cam)}animate();
</script></body></html>
