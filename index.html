<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Twist Pop Geometry Test</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#eee;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#182028}header{position:fixed;z-index:4;top:0;left:0;right:0;height:82px;background:#fffffff2;padding:14px 18px}h1{margin:0;font-size:22px}.sub{font-size:12px;color:#687680;margin-top:4px}#c{position:absolute;inset:82px 0 0;width:100%;height:calc(100% - 82px);touch-action:none}.tip{position:fixed;z-index:5;bottom:24px;left:50%;transform:translateX(-50%);background:#182028;color:#fff;padding:10px 14px;border-radius:18px;white-space:nowrap;font-size:13px}</style></head><body><header><h1>24 节魔尺 · 收拢几何验收</h1><div class="sub">目标：先正确拼成照片里的 4 × 6 矩形，再做关节运动</div></header><canvas id="c"></canvas><div class="tip">拖动旋转视角</div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const cv=document.querySelector('#c'),ren=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.shadowMap.enabled=true;ren.outputColorSpace=THREE.SRGBColorSpace;
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(34,1,.1,100);cam.position.set(6.7,6.2,9.5);cam.lookAt(0,0,0);
sc.add(new THREE.HemisphereLight(0xffffff,0x77808a,2.3));let dl=new THREE.DirectionalLight(0xffffff,3.3);dl.position.set(4,8,6);dl.castShadow=true;sc.add(dl);
let floor=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshStandardMaterial({color:0xe7e5e1,roughness:.9}));floor.rotation.x=-Math.PI/2;floor.position.y=-3.35;floor.receiveShadow=true;sc.add(floor);
const root=new THREE.Group();sc.add(root);
const blue=new THREE.MeshPhysicalMaterial({color:0x172f9e,roughness:.28,clearcoat:.25}), ivory=new THREE.MeshPhysicalMaterial({color:0xf2f0e8,roughness:.38,clearcoat:.14});
/* One physical unit is a right triangular prism.  Two complementary units occupy one square cell.
   The 24-piece folded reference is represented as 12 square cells in a 3 x 4 grid, with alternating
   diagonals.  Each visible diagonal is the actual mating face/hinge boundary of the two prisms. */
function triPrism(kind){
 const z=.72, verts=[];
 const A=[[-.5,-.5],[.5,-.5],[-.5,.5]], B=[[-.5,.5],[.5,-.5],[.5,.5]];
 const p=kind===0?A:B;
 for(const zz of [-z/2,z/2])for(const q of p)verts.push(q[0],q[1],zz);
 const idx=[0,1,2, 5,4,3, 0,3,4,0,4,1, 1,4,5,1,5,2, 2,5,3,2,3,0];
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));g.setIndex(idx);g.computeVertexNormals();return g;
}
const ga=triPrism(0),gb=triPrism(1), gap=.035, cell=1.04;
let pieceNo=0;
for(let row=0;row<4;row++)for(let col=0;col<3;col++){
 const flip=(row+col)%2;
 const x=(col-1)*cell,y=(1.5-row)*cell;
 // Complementary triangles make one exact square; alternating material recreates the blue/ivory bow-tie rhythm.
 let m1=new THREE.Mesh(flip?gb:ga,(pieceNo%2===0)?blue:ivory);pieceNo++;
 let m2=new THREE.Mesh(flip?ga:gb,(pieceNo%2===0)?blue:ivory);pieceNo++;
 for(const m of [m1,m2]){m.position.set(x,y,0);m.scale.set(.985,.985,1);m.castShadow=true;m.receiveShadow=true;root.add(m)}
 // visible seam is naturally the diagonal gap between two independently rendered prisms
}
// Add extremely subtle cell-edge seams only where folded chain changes row; not giant fake hinges.
const seamMat=new THREE.LineBasicMaterial({color:0x33383c,transparent:true,opacity:.42});
function line(a,b){let g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...a),new THREE.Vector3(...b)]);root.add(new THREE.Line(g,seamMat))}
for(let r=1;r<4;r++)line([-1.55,(2-r)*cell-.52, .37],[1.55,(2-r)*cell-.52,.37]);
root.rotation.x=-.08;root.rotation.y=-.18;
function resize(){let w=innerWidth,h=innerHeight-82;ren.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}resize();addEventListener('resize',resize);
let drag=false,lx=0,ly=0;cv.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointermove',e=>{if(!drag)return;root.rotation.y+=(e.clientX-lx)*.009;root.rotation.x+=(e.clientY-ly)*.006;lx=e.clientX;ly=e.clientY});cv.addEventListener('pointerup',()=>drag=false);
(function loop(){requestAnimationFrame(loop);ren.render(sc,cam)})();
</script></body></html>
